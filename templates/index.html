<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart UI/UX Issue Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">
  <h1 class="main-heading">🧠 Smart UI/UX Issue Detector</h1>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash-message">
      {% for message in messages %}
        <p style="color: #ff4d4d; font-weight: bold;">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

  <form action="/" method="post" enctype="multipart/form-data">
    <div class="upload-box" id="drop-area">
      <img src="{{ url_for('static', filename='img/upload.png') }}" alt="Upload Icon" class="upload-icon">
      <p>Drag & drop your UI screenshot here or click to browse</p>
      <input type="file" name="screenshot" id="fileElem" accept="image/*" onchange="previewFile()" hidden>
      <img id="preview" class="preview" src="#" alt="Image Preview" style="display:none;" />
    </div>

    <button type="submit">🚀 Detect Issues</button>
  </form>

  <div id="result"></div>
</div>

<script>
  const dropArea = document.getElementById("drop-area");
  const fileInput = document.getElementById("fileElem");
  const previewImg = document.getElementById("preview");

  dropArea.addEventListener("click", () => fileInput.click());

  dropArea.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropArea.classList.add("highlight");
  });

  dropArea.addEventListener("dragleave", () => {
    dropArea.classList.remove("highlight");
  });

  dropArea.addEventListener("drop", (e) => {
    e.preventDefault();
    dropArea.classList.remove("highlight");
    const file = e.dataTransfer.files[0];
    fileInput.files = e.dataTransfer.files;
    previewFile(file);
  });

  function previewFile(file = fileInput.files[0]) {
  if (file) {
    const reader = new FileReader();
    reader.onload = () => {
      previewImg.src = reader.result;
      previewImg.style.display = "block";
      previewImg.style.width = "90%";   // 🔥 Bigger width inside upload box
      previewImg.style.maxHeight = "400px"; // 🔥 Allow taller preview
      previewImg.style.objectFit = "contain"; 
      previewImg.style.marginTop = "20px";
    };
    reader.readAsDataURL(file);
  }
}

</script>

<p class="footer-credit">Developed with ❤️ by Ravi Parmar</p>
</body>
</html>
