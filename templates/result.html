<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prediction Result - Smart UI/UX Issue Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">
  <h1 class="main-heading">🧠 Prediction Result</h1>

  <div class="responsive-img">
    <img src="{{ img_path }}" alt="Uploaded Screenshot">
  </div>

  <h2 class="{% if label == 'Good UX' %}good-ux{% else %}bad-ux{% endif %}">{{ label }}</h2>

  <a href="/" class="try-again-btn">🔄 Try Another</a>
</div>

<p class="footer-credit">Developed with ❤️ by Ravi Parmar</p>

</body>
</html>
